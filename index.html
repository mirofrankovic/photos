<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
<!-- Adding Bootstrap CSS via CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
  <nav class="navbar">
      <img
        src="https://bitlearners.com/wp-content/uploads/2024/06/BitLearners-logo-1.png"
        alt="Logo"
        class="logo"
      />

      <ul class="menu">
        <li class="item"><a href="#">Home</a></li>
        <li class="item"><a href="#">About Us</a></li>
        <li class="item"><a href="#">Contact Us</a></li>
        <li class="item"><a href="#">Blog</a></li>
      </ul>

      <button type="submit">Call Now</button>
    </nav>
 <section id="main-menu-section">
        <div class="opaque-overlay">&nbsp;</div>
        <div class="container">
            <div class="row">
                <div class="col-12 offset-md-2 col-md-8 offset-lg-3 col-lg-6">
                    <div id="main-menu" class="pb-3 pt-2">
                        <h1 class="ml-3">
                            <strong>
                                Hello!<br />
                                Do you want to play a Pexeso?<br />
                                Let's play!
                            </strong>
                        </h1>
                        <div class="row">
                            <div class="offset-3 col-5">
                                <div id="main-image"><img src="assets/images/pexeso.jpg" alt="Title image for game" /></div>
                            </div>
                        </div>
                        <div class="options">
                            <button type="button" class="btn-block mx-auto p-4 mt-3 mb-3 click" id="play" data-bs-toggle="modal" data-bs-target="#level-modal">Play</button>
                            <button type="button" class="btn-block mx-auto p-1 click" id="about" data-bs-toggle="modal" data-bs-target="#about-modal">About</button>
                            <button type="button" class="btn-block mx-auto p-1 click" id="highscores" data-bs-toggle="modal" data-bs-target="#highscores-modal">Highscores</button>
                            <button type="button" class="btn-block mx-auto p-1 click" id="credits" data-bs-toggle="modal" data-bs-target="#credits-modal">Credits</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>  
     </section>
    
</body>
</html>
